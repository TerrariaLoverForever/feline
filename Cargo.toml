# Feline workspace.
#
# A workspace groups several crates (Rust packages) that are built together
# and share one Cargo.lock and one target/ directory.
#
#   crates/feline-core  library: everything that isn't GUI (testable on its own)
#   crates/feline       the application binary (GUI + `feline --info`)
#   crates/feline-runtime  Feline's own runtime (in development, M3)
#   crates/feline-png   PNG reading/writing shared by feline-core and the runtime

[workspace]
resolver = "3"
members = [
    "crates/feline-core",
    "crates/feline-png",
    "crates/feline",
    "crates/feline-runtime",
    "crates/feline-login",
    "crates/feline-win",
]

# Shared metadata. Each crate opts in with `field.workspace = true`.
[workspace.package]
version = "0.1.1"
edition = "2024"
# Minimum supported Rust version. We use Void's packaged toolchain (no rustup),
# so this documents what we need instead of a rust-toolchain.toml file.
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["The Feline contributors"]

[workspace.lints.rust]
# `deny` (not `forbid`) because Slint's generated UI code needs to opt out
# locally. feline-core keeps the stricter `forbid` in its lib.rs.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Smaller, faster release binary. Slower to compile, which only matters for releases.
lto = "thin"
codegen-units = 1
strip = true

# Quicker optimized builds for trying changes out (`cargo build --profile
# fast`, into target/fast): no link-time optimization and parallel code
# generation, so it builds in a fraction of release's time and needs less
# memory. Releases still use `release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
