# Pushing a tag like v0.2.0 builds Feline for Linux and Windows and
# publishes a GitHub release with the programs and their SHA-256 checksums
# (`feline` + `feline.sha256`, `feline.exe` + `feline.exe.sha256`): what
# Feline's own "Check for updates" downloads and verifies.
#
# The tag must match the version in Cargo.toml (without the v), or Feline
# won't see the release as newer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo build --release -p feline
      - name: Program and checksum
        run: |
          mkdir out
          cp target/release/feline out/feline
          cd out && sha256sum feline > feline.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p feline
      - name: Program and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/feline.exe out/feline.exe
          $hash = (Get-FileHash out/feline.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/feline.exe.sha256 -Value "$hash  feline.exe" -NoNewline -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
