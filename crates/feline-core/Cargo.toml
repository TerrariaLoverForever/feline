[package]
name = "feline-core"
description = "Feline's non-GUI core: system information, runtime backends, launching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Reading and writing the runtimes' JSON settings files. `preserve_order`
# keeps keys in their original order, so Feline's edits produce small,
# readable diffs and don't reshuffle another program's file.
serde_json = { version = "1", features = ["preserve_order"] }
