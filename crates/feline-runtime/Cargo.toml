[package]
name = "feline-runtime"
description = "Feline's own runtime for Roblox's Android client (in development, milestone M3)"
version.workspace = true
edition.workspace = true
# C-variadic function definitions (needed later for bionic and liblog) were
# verified on rustc 1.99; an older minimum hasn't been checked.
rust-version = "1.99"
# GPL-3.0-or-later with the additional permission in LICENSE.exception
# (combining with the Roblox client). Cargo can't express that exception.
license = "GPL-3.0-or-later"
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Safe(r) wrappers for the memory system calls the loader needs (mmap,
# mprotect, munmap, page size). Apache-2.0 WITH LLVM-exception OR Apache-2.0
# OR MIT. Default features off: no `std` I/O wrappers we don't use.
rustix = { version = "1.1", default-features = false, features = ["std", "mm", "param"] }
