[package]
name = "feline-runtime"
description = "Feline's own runtime for Roblox's Android client (in development, milestone M3)"
version.workspace = true
edition.workspace = true
# C-variadic function definitions (needed later for bionic and liblog) were
# verified on rustc 1.99; an older minimum hasn't been checked.
rust-version = "1.99"
# GPL-3.0-or-later with the additional permission in LICENSE.exception
# (combining with the Roblox client). Cargo can't express that exception.
license = "GPL-3.0-or-later"
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Safe(r) wrappers for the memory system calls the loader needs (mmap,
# mprotect, munmap, page size). Apache-2.0 WITH LLVM-exception OR Apache-2.0
# OR MIT. Default features off: no `std` I/O wrappers we don't use.
rustix = { version = "1.1", default-features = false, features = ["std", "mm", "param"] }
# `dlopen`/`dlsym`, to find the host's (glibc, GLES) functions the engine's
# imports are forwarded to. MIT OR Apache-2.0.
libc = "0.2"
# The window the engine draws into (Wayland, X11 fallback), the same
# windowing library the launcher uses through Slint. Apache-2.0.
winit = "0.30"
miniz_oxide = "0.9.1"
# Drawing typed text over focused text boxes (Roblox's own font from the
# APK). Apache-2.0. Already in the build through winit's decorations.
ab_glyph = "0.2"
# The desktop clipboard, for copy and paste in text boxes (Wayland through
# the data-control protocol, or X11). MIT OR Apache-2.0. Already in the
# build through the launcher's Slint.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Asking Roblox who the saved login belongs to (user ID and name, for the
# app's account questions). The launcher's HTTPS client: pure-Rust TLS.
# MIT OR Apache-2.0.
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
# Controllers (gamepads): the desktop's input devices with SDL's controller
# database for button names. MIT OR Apache-2.0.
gilrs = "0.11"
